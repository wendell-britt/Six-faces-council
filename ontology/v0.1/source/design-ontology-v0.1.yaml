entity_families:
  Agent:
    types: [Designer, GameMaster, Player, Ally, Helper, AI, Group, Institution, WorldAgent]
  DesignObject:
    types: [Game, DesignTool, Mechanic, Rule, NarrativeElement, CharacterRole, WorldElement, AdaptiveSystem, MotivationMechanism, Credential, Interface, Ritual, Prompt, ArtifactTemplate]
  PlayUnit:
    types: [EncounterDefinition, EncounterOccurrence, MoveDefinition, MoveInvocation, PracticeInstance, QuestDefinition, QuestInstance, ArcDefinition, ArcInstance, CampaignInstance, Session, CompletionContract, ParticipantExitRecord, EncounterEndRecord, MoveResolutionRecord, QuestDispositionRecord, ArcConclusionRecord, CompletionClaim, QuestCompletionClaim, InterruptionRecord, Checkpoint, ContinuationRecord]
  PhilosophyObject:
    types: [ConstitutionalPrinciple, ProvisionalCommitment, AestheticPattern, Polarity, AntiPattern, DesignQuestion, Guardrail, VerificationRule, FrameworkLens, FrameworkBoundary]
  DevelopmentObject:
    types: [DevelopmentLine, Capability, Affordance, Permission, Commitment, Credential, DevelopmentClaim]
  ExperientialObject:
    types: [Charge, LivedTension, State, Performance, Action, ExperienceEvent, Transformation, Outcome, Consequence, SomaticReport, SatisfactionReport, DesiredStateReport, ActionIntention, TransformationRecord]
  RelationalObject:
    types: [Relationship, TrustState, ConsentRecord, Boundary, Repair, CoordinationPattern, SharedMeaning, PurposePermission]
  EpistemicObject:
    types: [Claim, Observation, Interpretation, Hypothesis, EvidenceItem, TensionReport, TensionRepresentation, TensionConfiguration, DerivedMovementProposal, MovementFinding, DestinationClaim, RouteHypothesis, Uncertainty, Disagreement, Finding, Test]
  ProvenanceObject:
    types: [Source, ProvenanceRecord, Artifact, Seed, Revision, LifecycleRecord, CompostRecord, TensionSnapshot, TransformationTrace, MovementSourceReport, MovementRoutingPlan, MovementRoutingAssignment, DivergenceRecord, BlockerRecord, RecoverabilityPath, ArtifactDispatch, ActionRecord, ConsequenceRecord]
  PsychographicObject:
    types: [Psychograph, TypePreference, DesiredState, PleasureSignature, DesignShadow, AccessibilityNeed, AudienceHypothesis]
  FaceNamespaceObject:
    types: [GameMasterArchetype, AltitudeFace, SectDefinition, RuntimeSect, PlayerSectIdentity, ReviewDiscipline, CouncilLens, LensInvocation, PhaseVoiceAssignment]

game_master_archetypes:
  members: [shaman, challenger, regent, architect, diplomat, sage]
  semantics: shared_symbolic_lineage_only
  decision_record: outputs/council-phase-a/face-namespaces/council-decision.md
  excluded_inheritance:
    - runtime_permissions
    - player_affiliation
    - review_obligations
    - whole_person_rank
    - unilateral_decision_authority

face_namespaces:
  altitude_face:
    subject: scoped_developmental_interpretation
    required: [framework, archetype_key, line_or_domain, context, evidence, time, uncertainty]
  sect_definition:
    subject: player_facing_thematic_school
    required: [sect_key, mission, symbolism, content_rules, source_version]
  runtime_sect:
    subject: executable_ai_role
    required: [sect_key, tools, capabilities, routing, inputs, outputs, audit_provenance]
  player_sect_identity:
    subject: consented_revisable_player_affiliation
    required: [player, sect_definition, active_state, selection_source, effective_time, change_history]
  review_discipline:
    subject: functional_review_responsibility
    members: [ontologist, systems_architect, experience_designer, encounter_designer, steward, integrator]
    required: [review_key, domain, selection_reason, required_checks, authority, completion_evidence]
  council_lens:
    subject: bounded_epistemic_stance
    required: [archetype_key, question_set, evidence_foregrounded, predictable_losses, mandate]
  lens_invocation:
    subject: contextual_use_of_council_lens
    required: [lens, performer, question_or_cast, task_scope, output, provenance]
  phase_voice_assignment:
    subject: local_phase_voice_binding
    required: [phase, source_namespace, source_id, voice_function, scope]

development_lines:
  - emotional
  - somatic
  - interpretive
  - epistemic
  - relational
  - integrity
  - strategic
  - creative
  - narrative_agency
  - helping
  - stewardship
  - authorship
  - collective
  - systemic_participation
  - rest_refusal_release

aqal_perspectives:
  UL: interior_meaning_and_experience
  UR: enacted_behavior_and_somatic_expression
  LL: relationship_culture_and_shared_meaning
  LR: systems_roles_rules_and_persistent_consequences

evidence_types:
  - player_statement
  - somatic_report
  - behavioral_observation
  - relational_attestation
  - system_trace
  - persistent_artifact
  - research_source
  - ai_inference
  - council_synthesis
  - playtest_finding

claim_profile:
  confidence_labels: [unknown, tentative, plausible, supported, strong_within_scope]
  source_proximity: [direct_report, direct_observation, derived_evidence, inference]
  repeatability: [untested, single_instance, repeated_in_context, transferred_across_contexts]
  contestation: [uncontested, alternatives_present, actively_disputed, contradicted]
  interpretive_distance: [observation, interpretation, synthesis, speculation]
  maturity:
    - captured
    - researched
    - excavated
    - candidate
    - translated
    - drafted
    - modeled
    - council_ingested
    - play_observed
    - provisionally_adopted
    - verified
    - revised
    - contested
    - superseded

work_dispositions:
  - active
  - resting
  - reference
  - delegated
  - completed
  - compost_candidate
  - composted

relation_groups:
  authorship: [authors, co_authors, plays, facilitates, seeds, transforms, stewards, witnesses]
  mechanical_attention: [makes_mechanically_real, supports_narratively, supports_socially, leaves_implicit, excludes_from_scope, favors_type, burdens_type, invites_state]
  development: [develops, belongs_to_line, demonstrated_in, enables, constrains, changes_possibility, produces, leads_to, transfers_to]
  relationship_permission: [relates, grants, withholds, revokes, requires_consent_from, keeps, breaches, repairs, coordinates_with]
  evidence_interpretation: [observes, interprets, authors_personal_meaning, supports, challenges, complicates, predicts, tested_by, finds, revises, disagrees_with]
  provenance_lifecycle: [derived_from, preserves_trace_of, records_path, supersedes, rests, activates, references, composts]
  constitutional_versioning: [member_of_constitution, inherits_principle, amends_and_expands, current_successor_of]
  face_namespaces: [draws_from_archetype, interprets_archetype_as_altitude, makes_playable, dramatizes, operationalizes, affiliated_with, invokes_lens, performed_by, routes_to_runtime, reviewed_by, supports_review, bound_to_phase, shares_face_key_with, claims_altitude]
  motivation_risk: [motivates, supports_purpose, risks, guarded_by, exhibits_proxy_capture]
  play_lifecycle: [participates_in, occurs_within, invokes, ends, exits, refuses, rests, retreats_from, interrupts, suspends, resumes, resolves, completes, fails, expires, abandons, advances, blocks, concludes, reopens, continues_in, satisfies_condition_of, contributes_evidence_to]
  representation_lineage: [reports_on, represents, derived_from_reports, snapshot_of, proposes_movement, routes_design_unit, invites_movement, records_reported_shift, records_no_shift, proposes_cause, targets_state, selects_action, dispatches_artifact, reused_for, revises, rejects_representation, rejects_proposal, supersedes_snapshot, supersedes_proposal, derived_output_of, affected_by_correction]
  route_recoverability: [authors_destination, proposes_route, advances_destination, diverges_from_route, constrains_route, revises_destination, releases_destination, offers_recoverability, routes_around, leaves_unresolved, repairs_consequence]

encounter_and_completion:
  decision_record: outputs/council-phase-a/completion-boundaries/council-decision.md
  governing_rule: >-
    Moves resolve; encounters end; quests complete; arcs conclude.
  scope_transitions:
    participant: [exits, pauses, withdraws, refuses]
    session: [ends, suspends]
    encounter: [ends, suspends]
    move_invocation: [resolves, cancels, interrupts]
    quest: [completed, incomplete, failed, expired, declined, abandoned, superseded, composted, disputed, unassessed]
    arc: [concluded, open, branched, abandoned]
    transformation: [supported, unsupported, unclear, contested]
  independent_axes:
    activity: [available, active, suspended, ended]
    ending_mode: [resolved, rest, refusal, retreat, surrender, safety_stop, timeout, interruption, disconnection, handoff, abandonment, supersession]
    resolution_result: [success, partial, failure, no_effect, withdrawn, disputed, not_applicable]
    objective_judgment: [unassessed, unfulfilled, fulfilled, disputed, not_applicable]
    experiential_finding: [shift, no_shift, unclear, satisfying, unsatisfying, unreported]
    other: [consent_state, resumability, checkpoint, persistence, consequence, evidence_authority, contestation]
  encounter_contract_families: [contest, inquiry, relational, transformational, ritual, creative, recovery, governance, training]
  completion_contract_required_fields: [target_scope, criteria, criteria_version, evidence, evidence_authority, recognizing_agent, contesting_agents, consent_dependencies, temporal_scope, exit_behavior, resumption_rules, propagation_policy, consequences]

emotional_alchemy:
  terminology:
    basic_moves:
      name: Five Basic Moves
      members: [WakeUp, OpenUp, CleanUp, GrowUp, ShowUp]
    wave:
      reserved_for: Open Up breathing practice
      practice_steps: unspecified_in_current_ontology
    within_channel_progression:
      provisional_name: true
      members: [Wake, Clean, Grow, Show]
      explicitly_not_named: WAVE
    canonical_moves:
      count: 15
      families:
        Transcend: 5
        Generative: 5
        Control: 5
  sequence:
    - Charge
    - AttentionOrPractice
    - Transformation
    - SatisfactionEvidence
    - CapacityOrActionOrRelationshipOrArtifact
    - Consequence
  self_directed_authority: player_satisfaction_report
  allyship_constraints: [consent, relational_attestation, observable_consequence]
  derived_movement:
    decision_record: outputs/council-phase-a/derived-movement/reconstruction-and-decision.md
    governing_rule: >-
      A system may propose how authored material should route movement. It cannot
      infer from that proposal that a player moved.
    namespace_boundary:
      legacy_binary:
        type: LegacyEpiphanyMovementMode
        semantic_values: [integrate_within_frame, cross_frame_threshold]
        compatibility_encodings: [translate, transcend]
      canonical_fifteen_move:
        type: CanonicalAlchemyMoveFamily
        families: [Transcend, Generative, Control]
      shared_labels_imply_equivalence: false
    objects: [MovementSourceReport, DerivedMovementProposal, MovementRoutingPlan, MovementRoutingAssignment, MovementFinding]
    proposal_statuses: [unreviewed, accepted_for_routing, corrected, rejected, superseded, unknown]
    finding_values: [reported_shift, reported_no_shift, unclear, reinterpreted, refused, unassessed]
    correction_effects: [preserve_source_report, append_correction, stop_future_use, invalidate_or_flag_unpublished_descendants, version_published_descendants, preserve_historical_play_without_rejected_truth_claim, propagate_privacy_restrictions]

tension_representation:
  decision_record: outputs/council-phase-a/tension-vector/council-decision.md
  player_facing_term: Tension Map
  governing_principle: >-
    The player lives the tension. The system may preserve a correctable
    Tension Map of what was reported. Transformation is recorded separately.
  canonical_types:
    parent: TensionRepresentation
    dissatisfied_configuration: TensionConfiguration
    persisted_record: TensionSnapshot
    transformation_path: TransformationTrace
  legacy_alias:
    name: BARS321TensionVector
    legacy_alias_of: TensionConfiguration
    bare_term_status: retired
  separated_fields:
    rootCause: playerCausalHypothesis
    integrationShift: TransformationRecord
    alignedAction: ActionIntention
    desiredFeeling: DesiredStateReport
    artifact: ArtifactDispatch
  required_metadata: [source_encounter, source_reports, report_time, derivation_time, schema_version, derivation_version, included_fields, omitted_fields, purpose, audience, field_authorship, uncertainty, confirmation_status, privacy_class, retention, deletion_behavior, permitted_uses, downstream_lineage]
  distinct_permission_purposes: [collection, local_processing, persistence, derivation, explanation, artifact_generation, personalization, npc_world_adaptation, collective_reuse, sharing_publication, analytics_evaluation, model_improvement, retention, correction, deletion, revocation]

yellow_brick_road:
  decision_record: outputs/council-phase-a/yellow-brick-road/reconstruction-and-decision.md
  classification: mythic_orientation_and_recoverability_covenant
  precise_rule: no_path_has_to_be_wasted
  not_a: [metaphysical_claim, empirical_guarantee, universal_success_rule, compulsory_transformation_rule]
  objects: [DestinationClaim, RouteHypothesis, DivergenceRecord, BlockerRecord, RecoverabilityPath]
  recoverability_options: [learn, retry, repair, request_help, accommodate, alter_environment, choose_another_route, revise_destination, release_destination, rest, leave_unresolved, abandon, compost]
  blocker_rule: >-
    A blocker may remain unresolved indefinitely. It may continue to constrain a
    named route without creating an obligation to metabolize it.

integral_attention_declaration:
  required_fields:
    - intended_pleasure
    - mechanical_reality
    - foregrounded_quadrants
    - development_lines
    - implicit_support
    - exclusions
    - favored_and_burdened_types
    - invited_states
    - required_complexity
    - productive_tensions
    - risks
    - evidence_plan
    - exit_and_rest

hard_invariants:
  - no_global_developmental_rank_for_person
  - type_is_not_level
  - access_is_not_command
  - consent_is_not_inferred_from_compliance_acquisition_disclosure_or_continued_play
  - player_authors_personal_inner_meaning
  - inner_satisfaction_does_not_prove_external_helpfulness
  - external_approval_does_not_prove_inner_transformation
  - ai_inference_does_not_silently_become_user_belief
  - contradictory_evidence_is_preserved
  - engagement_is_not_sufficient_evidence_of_meaning
  - individual_games_need_not_mechanize_the_full_integral_ontology
  - captured_possibility_is_not_automatic_obligation
  - ai_raised_risk_requires_a_proposed_test
  - ontology_work_must_not_drift_into_unrequested_game_specification
  - explanation_must_not_automatically_remove_mystery
  - face_namespaces_are_not_interchangeable
  - shared_face_label_does_not_imply_object_identity
  - sect_choice_or_invocation_does_not_establish_altitude
  - face_use_does_not_establish_whole_person_worth_or_identity
  - player_affiliation_does_not_grant_runtime_or_governance_permission
  - runtime_routing_does_not_establish_player_identity
  - review_discipline_does_not_equal_named_game_master_archetype
  - council_convergence_does_not_equal_empirical_truth
  - cross_namespace_face_relations_require_scope_and_provenance
  - unqualified_face_identifiers_are_forbidden_when_semantics_affect_action
  - wave_names_only_the_open_up_breathing_practice
  - basic_moves_within_channel_progression_and_fifteen_move_grammar_are_distinct
  - encounter_ending_does_not_imply_move_resolution_quest_completion_arc_conclusion_or_transformation
  - move_resolution_does_not_imply_success
  - quest_inactivity_or_noncompletion_disposition_does_not_imply_quest_completion
  - child_completion_does_not_automatically_complete_parent
  - parent_conclusion_does_not_imply_all_children_completed
  - refusal_rest_retreat_witnessing_interruption_and_no_shift_do_not_satisfy_unmet_action_gates
  - completion_claims_require_scope_contract_evidence_authority_and_provenance
  - completion_criteria_cannot_be_retroactively_tightened_to_force_exit_prevention_or_transformation
  - tension_representation_is_not_lived_tension
  - player_causal_hypothesis_is_not_established_cause
  - transformation_satisfaction_action_artifact_and_consequence_are_not_source_configuration_fields
  - structured_extraction_is_not_anonymization
  - one_permission_purpose_does_not_authorize_another
  - bare_tension_vector_is_retired_from_new_formal_and_player_facing_use
  - legacy_migration_cannot_infer_missing_fields_or_retrospective_permission
  - derived_movement_proposal_is_not_enacted_movement
  - movement_routing_plan_is_not_transformation_evidence
  - legacy_binary_and_fifteen_move_grammars_are_not_equivalent_by_label
  - rejected_or_corrected_movement_proposal_cannot_silently_shape_future_personalization
  - movement_correction_or_rejection_is_not_resistance
  - recoverability_does_not_erase_harm_failure_or_irreversible_consequence
  - divergence_does_not_prove_hidden_desire
  - revised_destination_does_not_retroactively_fulfill_prior_destination
  - unresolved_blocker_does_not_create_perpetual_processing_obligation
  - refusal_to_metabolize_is_not_itself_a_blocker_diagnosis

minimum_record:
  required:
    - id
    - type
    - name
    - definition
    - status
    - provenance
    - scope
    - evidence
    - interpretations
    - relationships
    - uncertainties
    - tests
