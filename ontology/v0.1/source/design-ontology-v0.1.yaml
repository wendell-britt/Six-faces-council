  - rest_refusal_release

aqal_perspectives:
  UL: interior_meaning_and_experience
  UR: enacted_behavior_and_somatic_expression
  LL: relationship_culture_and_shared_meaning
  LR: systems_roles_rules_and_persistent_consequences

evidence_types:
  - player_statement
  - somatic_report
  - behavioral_observation
  - relational_attestation
  - system_trace
  - persistent_artifact
  - research_source
  - ai_inference
  - council_synthesis
  - playtest_finding

claim_profile:
  confidence_labels: [unknown, tentative, plausible, supported, strong_within_scope]
  source_proximity: [direct_report, direct_observation, derived_evidence, inference]
  repeatability: [untested, single_instance, repeated_in_context, transferred_across_contexts]
  contestation: [uncontested, alternatives_present, actively_disputed, contradicted]
  interpretive_distance: [observation, interpretation, synthesis, speculation]
  maturity:
    - captured
    - researched
    - excavated
    - candidate
    - translated
    - drafted
    - modeled
    - council_ingested
    - play_observed
    - provisionally_adopted
    - verified
    - revised
    - contested
    - superseded

work_dispositions:
  - active
  - resting
  - reference
  - delegated
  - completed
  - compost_candidate
  - composted

relation_groups:
  authorship: [authors, co_authors, plays, facilitates, seeds, transforms, stewards, witnesses]
  mechanical_attention: [makes_mechanically_real, supports_narratively, supports_socially, leaves_implicit, excludes_from_scope, favors_type, burdens_type, invites_state]
  development: [develops, belongs_to_line, demonstrated_in, enables, constrains, changes_possibility, produces, leads_to, transfers_to]
  relationship_permission: [relates, grants, withholds, revokes, requires_consent_from, keeps, breaches, repairs, coordinates_with]
  evidence_interpretation: [observes, interprets, authors_personal_meaning, supports, challenges, complicates, predicts, tested_by, finds, revises, disagrees_with]
  provenance_lifecycle: [derived_from, preserves_trace_of, records_path, supersedes, rests, activates, references, composts]
  constitutional_versioning: [member_of_constitution, inherits_principle, amends_and_expands, current_successor_of]
  face_namespaces: [draws_from_archetype, interprets_archetype_as_altitude, makes_playable, dramatizes, operationalizes, affiliated_with, invokes_lens, performed_by, routes_to_runtime, reviewed_by, supports_review, bound_to_phase, shares_face_key_with, claims_altitude]
  motivation_risk: [motivates, supports_purpose, risks, guarded_by, exhibits_proxy_capture]
  play_lifecycle: [participates_in, occurs_within, invokes, ends, exits, refuses, rests, retreats_from, interrupts, suspends, resumes, resolves, completes, fails, expires, abandons, advances, blocks, concludes, reopens, continues_in, satisfies_condition_of, contributes_evidence_to]
  representation_lineage: [reports_on, represents, derived_from_reports, snapshot_of, proposes_movement, routes_design_unit, invites_movement, records_reported_shift, records_no_shift, proposes_cause, targets_state, selects_action, dispatches_artifact, reused_for, revises, rejects_representation, rejects_proposal, supersedes_snapshot, supersedes_proposal, derived_output_of, affected_by_correction]
  route_recoverability: [authors_destination, proposes_route, advances_destination, diverges_from_route, constrains_route, revises_destination, releases_destination, offers_recoverability, routes_around, leaves_unresolved, repairs_consequence]

encounter_and_completion:
  decision_record: outputs/council-phase-a/completion-boundaries/council-decision.md
  governing_rule: >-
    Moves resolve; encounters end; quests complete; arcs conclude.
  scope_transitions:
    participant: [exits, pauses, withdraws, refuses]
    session: [ends, suspends]
    encounter: [ends, suspends]
    move_invocation: [resolves, cancels, interrupts]
    quest: [completed, incomplete, failed, expired, declined, abandoned, superseded, composted, disputed, unassessed]
    arc: [concluded, open, branched, abandoned]
    transformation: [supported, unsupported, unclear, contested]
  independent_axes:
    activity: [available, active, suspended, ended]
    ending_mode: [resolved, rest, refusal, retreat, surrender, safety_stop, timeout, interruption, disconnection, handoff, abandonment, supersession]
    resolution_result: [success, partial, failure, no_effect, withdrawn, disputed, not_applicable]
    objective_judgment: [unassessed, unfulfilled, fulfilled, disputed, not_applicable]
    experiential_finding: [shift, no_shift, unclear, satisfying, unsatisfying, unreported]
    other: [consent_state, resumability, checkpoint, persistence, consequence, evidence_authority, contestation]
  encounter_contract_families: [contest, inquiry, relational, transformational, ritual, creative, recovery, governance, training]
  completion_contract_required_fields: [target_scope, criteria, criteria_version, evidence, evidence_authority, recognizing_agent, contesting_agents, consent_dependencies, temporal_scope, exit_behavior, resumption_rules, propagation_policy, consequences]

emotional_alchemy:
  terminology:
    basic_moves:
      name: Five Basic Moves
      members: [WakeUp, OpenUp, CleanUp, GrowUp, ShowUp]
    wave:
      reserved_for: Open Up breathing practice
      practice_steps: unspecified_in_current_ontology
    within_channel_progression:
      provisional_name: true
      members: [Wake, Clean, Grow, Show]
      explicitly_not_named: WAVE
    canonical_moves:
      count: 15
      families:
        Transcend: 5
        Generative: 5
        Control: 5
  sequence:
    - Charge
    - AttentionOrPractice
    - Transformation
    - SatisfactionEvidence
    - CapacityOrActionOrRelationshipOrArtifact
    - Consequence
  self_directed_authority: player_satisfaction_report
  allyship_constraints: [consent, relational_attestation, observable_consequence]
  derived_movement:
    decision_record: outputs/council-phase-a/derived-movement/reconstruction-and-decision.md
    governing_rule: >-
      A system may propose how authored material should route movement. It cannot
      infer from that proposal that a player moved.
    namespace_boundary:
      legacy_binary:
        type: LegacyEpiphanyMovementMode
        semantic_values: [integrate_within_frame, cross_frame_threshold]
        compatibility_encodings: [translate, transcend]
      canonical_fifteen_move:
        type: CanonicalAlchemyMoveFamily
        families: [Transcend, Generative, Control]
      shared_labels_imply_equivalence: false
    objects: [MovementSourceReport, DerivedMovementProposal, MovementRoutingPlan, MovementRoutingAssignment, MovementFinding]
    proposal_statuses: [unreviewed, accepted_for_routing, corrected, rejected, superseded, unknown]
    finding_values: [reported_shift, reported_no_shift, unclear, reinterpreted, refused, unassessed]
    correction_effects: [preserve_source_report, append_correction, stop_future_use, invalidate_or_flag_unpublished_descendants, version_published_descendants, preserve_historical_play_without_rejected_truth_claim, propagate_privacy_restrictions]

tension_representation:
  decision_record: outputs/council-phase-a/tension-vector/council-decision.md
  player_facing_term: Tension Map
  governing_principle: >-
    The player lives the tension. The system may preserve a correctable
    Tension Map of what was reported. Transformation is recorded separately.
  canonical_types:
    parent: TensionRepresentation
    dissatisfied_configuration: TensionConfiguration
    persisted_record: TensionSnapshot
    transformation_path: TransformationTrace
  legacy_alias:
    name: BARS321TensionVector
    legacy_alias_of: TensionConfiguration
    bare_term_status: retired
  separated_fields:
    rootCause: playerCausalHypothesis
    integrationShift: TransformationRecord
    alignedAction: ActionIntention
    desiredFeeling: DesiredStateReport
    artifact: ArtifactDispatch
  required_metadata: [source_encounter, source_reports, report_time, derivation_time, schema_version, derivation_version, included_fields, omitted_fields, purpose, audience, field_authorship, uncertainty, confirmation_status, privacy_class, retention, deletion_behavior, permitted_uses, downstream_lineage]
  distinct_permission_purposes: [collection, local_processing, persistence, derivation, explanation, artifact_generation, personalization, npc_world_adaptation, collective_reuse, sharing_publication, analytics_evaluation, model_improvement, retention, correction, deletion, revocation]

yellow_brick_road:
  decision_record: outputs/council-phase-a/yellow-brick-road/reconstruction-and-decision.md
  classification: mythic_orientation_and_recoverability_covenant
  precise_rule: no_path_has_to_be_wasted
  not_a: [metaphysical_claim, empirical_guarantee, universal_success_rule, compulsory_transformation_rule]
  objects: [DestinationClaim, RouteHypothesis, DivergenceRecord, BlockerRecord, RecoverabilityPath]
  recoverability_options: [learn, retry, repair, request_help, accommodate, alter_environment, choose_another_route, revise_destination, release_destination, rest, leave_unresolved, abandon, compost]
  blocker_rule: >-
    A blocker may remain unresolved indefinitely. It may continue to constrain a
    named route without creating an obligation to metabolize it.

roadblocks:
  decision_record: ontology/v0.1/source/council-phase-a/roadblocks/reconstruction-and-decision.md
  governing_rule: >-
    A roadblock may reveal a mismatch among intention, method, conditions, and
    capacity; it does not prove misaligned intention.
  sequence:
    - RoadblockEvent
    - RoadblockClassification
    - RoadblockCausalAccount
    - IntentionAlignmentHypothesis
    - RoadblockResponse
    - MetabolizationOutcome
  classifications:
    - technical
    - dependency
    - resource
    - coordination
    - capability
    - environmental
    - relational
    - emotional_interpretive
    - safety_ethical
    - unknown
  causal_claim_statuses:
    - observed_correlation
    - contributing_condition
    - proximate_cause
    - root_cause_hypothesis
    - verified_within_declared_test_scope
  response_options:
    - repair
    - retry
    - test
    - request_help
    - accommodate
    - alter_environment
    - acquire_capability
    - renegotiate
    - reroute
    - pause
    - rest
    - accept_constraint
    - leave_unresolved
    - set_down
    - abandon
    - compost
  technical_metabolization_may_produce:
    - repair
    - verification
    - safer_route
    - reusable_learning
    - provenance_artifact
  intention_alignment_hypothesis_requires:
    - declared_intention
    - represented_agent
    - hypothesis_author
    - relevant_method_conditions_or_capacity
    - supporting_and_contradicting_evidence
    - uncertainty
    - confirmation_correction_or_rejection_status
  prohibitions:
    - no_psychological_diagnosis_from_technical_failure
    - no_hidden_intention_inference
    - no_refusal_as_confirmation
    - no_emotional_disclosure_required_for_technical_repair
    - no_inner_work_reframe_that_erases_external_constraint

session_depth_and_disclosure:
  decision_record: ontology/v0.1/source/council-phase-a/session-depth/reconstruction-and-decision.md
  governing_rules:
    - gameplay_performance_is_valid_evidence_of_named_performance
    - response_length_and_intimacy_do_not_establish_inner_depth
    - intimate_disclosure_is_not_progression_currency
    - relevant_permitted_material_may_support_more_specific_tailoring
    - all_players_receive_the_same_baseline_craft_and_core_access
  legacy_session_depth_signal:
    status: retained_as_unimplemented_legacy_proposal
    not_a: [inner_depth_measure, genuineness_measure, transformation_measure, deftness_measure]
    replacement: ResponseAffordanceProfile
  objects:
    - ResponseMaterial
    - ResponseAffordanceProfile
    - PracticePerformanceRecord
    - DepthClaim
    - InputSufficiencyContract
    - ArtifactTailoringPlan
    - ArtifactFitFinding
    - PacingAdaptationProposal
    - DeftnessFinding
  response_affordance_fields:
    - relevant_specificity
    - concrete_constraints
    - desired_consequences
    - relational_links
    - temporal_links
    - examples
    - counterexamples
    - ambiguity
    - uncertainty
    - imagery_tone_and_metaphor
    - modality_coverage
    - preserved_omissions
    - confidence
    - correction_status
  distinct_claims:
    - response_volume
    - response_specificity
    - practice_performance
    - player_reported_experiential_depth
    - design_resolution_depth
    - interpretive_complexity
    - relational_depth
    - artifact_specificity
    - artifact_richness_dimension
    - artifact_quality
    - artifact_fit
    - pacing_need
    - demonstrated_deftness
  input_sufficiency_contract_requires:
    - purpose
    - promised_adaptation
    - necessary_fields
    - optional_fields
    - non_sensitive_alternatives
    - uncertainty_behavior
    - processing_location
    - retention_and_downstream_use
    - insufficient_material_fallback
  equivalent_routes:
    - concise
    - selection
    - arrangement
    - image
    - gesture
    - scale
    - analogy
    - fictionalization
    - example_choice
    - private_local_processing
    - later_revision
  prohibited_progression_inputs:
    - disclosure_volume
    - disclosure_intimacy
    - pain_magnitude
    - fear_intensity
    - verbal_vulnerability
  tailoring_fallbacks:
    - labeled_general_artifact
    - optional_follow_up
    - examples_or_presets
    - player_selection
    - symbolic_or_nonverbal_input
    - preserve_uncertainty
  pacing_rule: >-
    Pacing adaptations based on behavioral signals are proposals. They remain
    visible or readily correctable, reversible, and under player control.

bar_scope:
  decision_record: ontology/v0.1/source/council-phase-a/bar-scope/reconstruction-and-decision.md
  definition: >-
    An intentionally captured, portable kernel of potential with stable identity
    and provenance, stewarded so it can bloom, be revised, fork, combine, rest,
    ship, or be released across one or more expressions.
  governing_rules:
    - every_bar_has_provenance
    - not_every_provenance_bearing_object_is_a_bar
    - charge_is_optional
    - kernel_and_expression_are_distinct
    - capture_does_not_create_implementation_obligation
    - portability_is_permission_bound
  required_properties:
    - intentional_kernel_capture
    - stable_identity
    - compressed_potential
    - provenance
    - plausible_expression_development_or_transfer_context
    - steward_owning_scope_or_explicitly_unowned_state
    - lifecycle_and_version_history
    - portability_and_permission_policy
  objects:
    - BAR
    - BARCandidate
    - ChargedBAR
    - BARExpression
    - BARPromotion
    - BARRoleRelease
    - BARProvenanceRecord
    - BARPortabilityPolicy
  source_modes:
    - charge
    - request
    - observation
    - inspiration
    - opportunity
    - problem
    - design_idea
    - decision
    - rule_or_norm_proposal
    - lore_or_world_seed
    - imported_artifact
    - fork
  expression_types:
    - quest
    - rule
    - lore
    - design_decision
    - feature_specification
    - implementation_plan
    - community_norm
    - branch
    - encounter_seed
    - artifact
  typed_lineage_relations:
    - derived_from
    - expresses
    - forked_from
    - grafted_from
    - revises
    - implements
    - instantiates
    - harvested_from
    - composted_from
  distinct_axes:
    - bar_lifecycle
    - structural_maturity
    - social_adoption
    - epistemic_maturity
    - work_disposition
    - quest_completion
    - implementation_status
  classification_test:
    - intentionally_captured_as_kernel
    - compressed_potential_named
    - plausible_bloom_context_named
    - stable_identity_and_provenance_present
    - stewardship_and_permissions_named
    - current_expression_and_lifecycle_state_named
  prohibitions:
    - no_automatic_bar_identity_from_provenance
    - no_charge_requirement_or_inference
    - no_automatic_bar_identity_for_outputs
    - no_capture_as_implementation_debt
    - no_permissionless_portability
    - no_lineage_erasure

composting:
  decision_record: ontology/v0.1/source/council-phase-a/composting/reconstruction-and-decision.md
  definition: >-
    A governed lifecycle disposition that ends a named active obligation while
    preserving only the lineage, learning, or reusable residue that is
    appropriate and permitted.
  governing_rules:
    - release_completes_composting
    - residue_is_optional_and_permission_bound
    - regeneration_is_a_new_event
    - reactivation_creates_a_new_obligation
    - recoverability_does_not_preserve_active_obligation
  sequence:
    - CompostCandidate
    - CompostingDecision
    - CompostingDisposition
    - CompostRecord
    - CompostResidue
    - RegenerationEvent
  objects:
    - CompostCandidate
    - CompostingDecision
    - CompostingDisposition
    - CompostRecord
    - CompostResidue
    - RegenerationEvent
    - ReactivationDecision
    - CompostRecoverability
  not_required_for_completion:
    - new_artifact
    - lesson
    - emotional_transformation
    - vibeulon_generation
    - later_reuse
    - recovered_value
    - proof_of_strategic_optimality
  distinct_from:
    - deletion
    - archival_or_reference
    - abandonment
    - supersession
    - original_contract_completion
  active_behaviors_that_stop:
    - backlog_pressure
    - overdue_status
    - guilt_shame_or_failure_messaging
    - progress_penalties
    - required_review
    - automatic_resurfacing
    - completion_or_metabolization_prompts
    - counting_as_unfinished_active_work
  residue_types:
    - lesson
    - reusable_pattern
    - excerpt_or_source_artifact
    - unresolved_question
    - warning_or_failed_test
    - relationship_or_dependency_map
    - aesthetic_fragment
    - provenance_only_tombstone
  recoverability_levels:
    - none
    - decision_only
    - lineage_only
    - residue_available
    - source_restorable
    - implementation_restorable
  authority_rules:
    - own_obligation_may_be_released_absent_shared_contract
    - shared_obligation_uses_contract_authority
    - personal_material_retention_and_reuse_follow_data_subject_authority
    - another_agents_rights_commitments_and_meaning_cannot_be_composted_unilaterally
