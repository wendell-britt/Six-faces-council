ontology:
  id: wendell_design_ontology
  version: "0.1"
  status: provisional_model
  owner: Wendell Britt
  purpose: >-
    Guide game design, design tools, AI collaborators, and Game Master agents
    while preserving aesthetic coherence, surprise, player authorship, and provenance.
  current_constitution: constitution_v0_1_fifteen

constitutional_collections:
  constitution_seed_eight:
    name: Eight-principle constitutional seed
    source: outputs/design-ontology-six-face-council-brief.md
    status: preserved_seed
    members:
      - seed_p1_game_master_is_also_player
      - seed_p2_designer_is_also_player
      - seed_p3_design_for_psychographic_neighborhood
      - seed_p4_body_gets_vote
      - seed_p5_helper_inside_field_of_care
      - seed_p6_tool_practices_teaching
      - seed_p7_composting_valid_completion
      - seed_p8_motivation_not_meaning
  constitution_v0_1_fifteen:
    name: Fifteen-principle provisional v0.1 constitution
    source: outputs/design-philosophy-draft-v0.1.md
    status: current_provisional
    relation_to_predecessor: amends_and_expands
    predecessor: constitution_seed_eight
    decision_record: outputs/council-phase-a/constitutional-evolution/council-decision.md
    members:
      - v0_1_p1_game_master_is_also_player
      - v0_1_p2_designer_is_also_player
      - v0_1_p3_authentic_pleasure_translate_outward
      - v0_1_p4_body_gets_vote
      - v0_1_p5_mechanics_claim_reality
      - v0_1_p6_development_changes_possibility
      - v0_1_p7_relationship_source_of_capability
      - v0_1_p8_play_precedes_understanding
      - v0_1_p9_mystery_rewards_inquiry
      - v0_1_p10_player_authors_personal_meaning
      - v0_1_p11_preserve_lineage
      - v0_1_p12_helper_inside_field_of_care
      - v0_1_p13_tool_practices_teaching
      - v0_1_p14_composting_valid_completion
      - v0_1_p15_motivation_not_meaning

constitutional_lineage:
  inherited:
    seed_p1_game_master_is_also_player: v0_1_p1_game_master_is_also_player
    seed_p2_designer_is_also_player: v0_1_p2_designer_is_also_player
    seed_p3_design_for_psychographic_neighborhood: v0_1_p3_authentic_pleasure_translate_outward
    seed_p4_body_gets_vote: v0_1_p4_body_gets_vote
    seed_p5_helper_inside_field_of_care: v0_1_p12_helper_inside_field_of_care
    seed_p6_tool_practices_teaching: v0_1_p13_tool_practices_teaching
    seed_p7_composting_valid_completion: v0_1_p14_composting_valid_completion
    seed_p8_motivation_not_meaning: v0_1_p15_motivation_not_meaning
  added_during_evolution:
    - v0_1_p5_mechanics_claim_reality
    - v0_1_p6_development_changes_possibility
    - v0_1_p7_relationship_source_of_capability
    - v0_1_p8_play_precedes_understanding
    - v0_1_p9_mystery_rewards_inquiry
    - v0_1_p10_player_authors_personal_meaning
    - v0_1_p11_preserve_lineage
  emergence_path:
    - aesthetic_excavation
    - pattern_extraction
    - framework_translation
    - constitutional_promotion_in_philosophy_v0_1
    - operationalization_in_ontology_model_v0_1
    - six_face_lineage_decision

entity_families:
  Agent:
    types: [Designer, GameMaster, Player, Ally, Helper, AI, Group, Institution, WorldAgent]
  DesignObject:
    types: [Game, DesignTool, Mechanic, Rule, NarrativeElement, CharacterRole, WorldElement, AdaptiveSystem, MotivationMechanism, Credential, Interface, Ritual, Prompt, ArtifactTemplate]
  PlayUnit:
    types: [EncounterDefinition, EncounterOccurrence, MoveDefinition, MoveInvocation, PracticeInstance, QuestDefinition, QuestInstance, ArcDefinition, ArcInstance, CampaignInstance, Session, CompletionContract, ParticipantExitRecord, EncounterEndRecord, MoveResolutionRecord, QuestDispositionRecord, ArcConclusionRecord, CompletionClaim, QuestCompletionClaim, InterruptionRecord, Checkpoint, ContinuationRecord]
  PhilosophyObject:
    types: [ConstitutionalPrinciple, ProvisionalCommitment, AestheticPattern, Polarity, AntiPattern, DesignQuestion, Guardrail, VerificationRule, FrameworkLens, FrameworkBoundary]
  DevelopmentObject:
    types: [DevelopmentLine, Capability, Affordance, Permission, Commitment, Credential, DevelopmentClaim]
  ExperientialObject:
    types: [Charge, LivedTension, State, Performance, Action, ExperienceEvent, Transformation, Outcome, Consequence, SomaticReport, SatisfactionReport, DesiredStateReport, ActionIntention, TransformationRecord]
  RelationalObject:
    types: [Relationship, TrustState, ConsentRecord, Boundary, Repair, CoordinationPattern, SharedMeaning, PurposePermission]
  EpistemicObject:
    types: [Claim, Observation, Interpretation, Hypothesis, EvidenceItem, TensionReport, TensionRepresentation, TensionConfiguration, DerivedMovementProposal, MovementFinding, DestinationClaim, RouteHypothesis, Uncertainty, Disagreement, Finding, Test]
  ProvenanceObject:
    types: [Source, ProvenanceRecord, Artifact, Seed, Revision, LifecycleRecord, CompostRecord, TensionSnapshot, TransformationTrace, MovementSourceReport, MovementRoutingPlan, MovementRoutingAssignment, DivergenceRecord, BlockerRecord, RecoverabilityPath, ArtifactDispatch, ActionRecord, ConsequenceRecord]
  PsychographicObject:
    types: [Psychograph, TypePreference, DesiredState, PleasureSignature, DesignShadow, AccessibilityNeed, AudienceHypothesis]
  FaceNamespaceObject:
    types: [GameMasterArchetype, AltitudeFace, SectDefinition, RuntimeSect, PlayerSectIdentity, ReviewDiscipline, CouncilLens, LensInvocation, PhaseVoiceAssignment]

game_master_archetypes:
  members: [shaman, challenger, regent, architect, diplomat, sage]
  semantics: shared_symbolic_lineage_only
  decision_record: outputs/council-phase-a/face-namespaces/council-decision.md
  excluded_inheritance:
    - runtime_permissions
    - player_affiliation
    - review_obligations
    - whole_person_rank
    - unilateral_decision_authority

face_namespaces:
  altitude_face:
    subject: scoped_developmental_interpretation
    required: [framework, archetype_key, line_or_domain, context, evidence, time, uncertainty]
  sect_definition:
    subject: player_facing_thematic_school
    required: [sect_key, mission, symbolism, content_rules, source_version]
  runtime_sect:
    subject: executable_ai_role
    required: [sect_key, tools, capabilities, routing, inputs, outputs, audit_provenance]
  player_sect_identity:
    subject: consented_revisable_player_affiliation
    required: [player, sect_definition, active_state, selection_source, effective_time, change_history]
  review_discipline:
    subject: functional_review_responsibility
    members: [ontologist, systems_architect, experience_designer, encounter_designer, steward, integrator]
    required: [review_key, domain, selection_reason, required_checks, authority, completion_evidence]
  council_lens:
    subject: bounded_epistemic_stance
    required: [archetype_key, question_set, evidence_foregrounded, predictable_losses, mandate]
  lens_invocation:
    subject: contextual_use_of_council_lens
    required: [lens, performer, question_or_cast, task_scope, output, provenance]
  phase_voice_assignment:
    subject: local_phase_voice_binding
    required: [phase, source_namespace, source_id, voice_function, scope]

