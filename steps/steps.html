<style>
/* Layout: one short notice. Your steps moved to a tab on the Council Board, on Wendell's ruling at board read 8. */
:root{ --bg:#f6f5f1; --fg:#1d1f1e; --muted:#5d625f; --accent:#1f6f6a; --accent-ink:#ffffff;
  --display:"IBM Plex Serif",Georgia,"Times New Roman",serif; --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#17191a; --fg:#ece9e1; --muted:#a4a8a3; --accent:#5fc2ba; --accent-ink:#0f1a19; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#17191a; --fg:#ece9e1; --muted:#a4a8a3; --accent:#5fc2ba; --accent-ink:#0f1a19; color-scheme:dark; }
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;font-size:15px;padding-block:48px;padding-inline:16px;max-width:620px;margin:0 auto}
h1{font-family:var(--display);font-weight:600;font-size:1.8rem;margin:0 0 10px;text-wrap:balance}
p{color:var(--muted);margin:0 0 18px}
a.go{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:4px;text-decoration:none;font-weight:500}
a.go:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
