source: https://gameplayatlas.loopyhop.com/
fetched: 2026-10-24
taxonomy: |
  Gameplay Atlas ("A field guide to game mechanics", by loopyhop) is a JS app that loads one catalog.json
  (/assets/<hash>/catalog.json, 280 entries, bilingual en/zh) and also lists every mechanic in /sitemap.xml.
  Structure: 5 families > 28 systems > 280 mechanics (8-18 per system). Each mechanic also carries cross-cutting
  tags from a 16-tag axis (planning, risk, spatial, optimization, information, timing, economy, progression, time,
  precision, discovery, dexterity, narrative, creativity, cooperation, randomness), a prototype scope
  (small/medium/large) and interaction (solo/cooperative/competitive), related-mechanic links, combinesWith systems,
  and cross-system combination ideas. Each entry has rules, a loop, design decisions, tunable parameters, real-game
  cases (with source and screenshot credits), a walkthrough, and a first-prototype step. No outside framework named
  (the site says categories describe mechanisms). Author: no named person; brand loopyhop.
  Licence: no content licence stated. Footer: game screenshots and trademarks belong to their owners and inclusion
  grants no licence to reuse images; cases describe game rules; design levers and combinations are editorial analysis.
  Treat as all-rights-reserved; this inventory is a factual index with paraphrased/short summaries only.
  Fields in this file: names, systems, tags, example games and links only. The site's blurbs are left out (no licence); our own gists are in crosswalk-a.yaml and crosswalk-b.yaml.
