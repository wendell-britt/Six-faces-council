# crosswalk part b: Combine & allocate, Control & respond
- id: combat-stamina-budget
  gist: One pool of effort pays for both striking and guarding, so every action trades against safety.
  claim: {tracks: effort pool, rewards: spending wisely, gates: acts when pool empty, remembers: '-', permits: attack or defend within the pool, changes: 'pool level, openness to harm'}
  ontology: [MoveDefinition, Rule, State]
  fit: gap
  note: needs a named spendable meter with refill rule (ResourceMeter); a rest option maps to rest and recovery as valid play
  strands: [spar, calrunia]
- id: combat-timed-parry
  gist: A guard pressed at the exact instant of an incoming blow turns it aside and opens the foe.
  claim: {tracks: blow timing, rewards: precise timing, gates: parry only inside window, remembers: '-', permits: deflect, changes: foe openness}
  ontology: [MoveDefinition, Performance, MoveResolutionRecord]
  fit: gap
  note: needs TimingWindow; performance is evidence of the move, not of inner state (practice_performance invariant)
  strands: [spar]
- id: combat-invulnerable-dodge
  gist: A short dodge makes you untouchable for a few frames, so bold stepping through danger is the skill.
  claim: {tracks: dodge window, rewards: safe passage, gates: dodge needs window and cooldown, remembers: '-', permits: pass through danger, changes: 'position, exposure'}
  ontology: [MoveDefinition, Performance]
  fit: gap
  note: TimingWindow again; the safety is a rule of the move not a claim about the player
  strands: [spar]
- id: combat-posture-break
