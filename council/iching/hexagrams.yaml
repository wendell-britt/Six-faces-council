about: 'The 64 hexagrams in the King Wen order: number, Chinese name, pinyin, lines from the bottom up (1 unbroken,
  0 broken), and the two trigrams, lower then upper. These are the I Ching''s own traditional facts. They were read
  from flirtcraft''s lib/decks.json and checked line by line against the trigrams. Flirtcraft''s card readings,
  which its subscription sells, are not copied here.'
