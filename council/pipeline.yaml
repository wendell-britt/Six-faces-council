# The feature pipeline: how a new feature goes from Wendell's ask to the live site, run by the six
# faces. Read by the six-faces skill. Synced to every council repo with faces.yaml.
#
# Designed in council/passes/6FACE_PASS5_2026-10-02.md at Wendell's request on 2026-10-02:
#   "steps I have to do myself should generate a step by step checklist I can run from. Things that
#    need building should go through a production pipeline managed by the 6 faces"
# This file is the council's design, not a ruling of Wendell's. Each part stands as a position on
# the board until he flips it.

scope:
  runs_for: >
    A new feature: behaviour a person can see or use, or data the product keeps, that did not exist
    before. It starts when Wendell asks for one, or when a pass proposes one and he says yes.
  not_for:
    - A fix to behaviour that already exists. That gets a pass if it needs one, and a pull request.
    - Manuscript prose in friendcraft. Canonical prose is reserved; the repo's own rules govern it.
  repo_rules_win: >
    Where a repo has its own spec kit rules, they win on conventions. bars-engine keeps its template,
    its Verification Quests and its Build/Infra Blocker Protocol; the pipeline adds its sections to
    that template instead of replacing it.

where: .specify/specs/<feature-name>/   # spec.md, plan.md, tasks.md, as bars-engine already does

templates: council/spec-kit/            # spec.md, plan.md, tasks.md, synced from the home repo

# Three typed outputs, kept apart. A pass never mixes them.
outputs:
  questions: the Council Board, https://claude.ai/artifact/DxyShVS8tmvJym4HAsgnho
  steps: the Your steps tab on the same board, named in steps_page below
  product: a pull request per feature, on its own branch

steps_page: https://claude.ai/artifact/DxyShVS8tmvJym4HAsgnho#steps   # the Your steps tab; Wendell overruled a separate page at board read 8

# Deferral. Wendell asked for it at board read 20 (2026-10-03), on the oracle drafts: "We need to be
# able to defer projects so they don't get trapped on the board, but we are also collecting data
# about priority". Any question or position row on the board has a Defer button with a return date.
defer:
  until: [week, month, ask]   # in a week, in a month, or when Wendell asks for it back
  board: a deferred row leaves the Open tab and waits in the Deferred section of the Resolved tab.
    It returns to the Open tab by itself when its date passes. A row deferred until he asks returns
    only when he asks.
  council: the council does not ask about a deferred item again before its date, and does not
    re-raise it under a new id. Work on it stops where it stands; an open pull request stays open
    and is marked deferred.
  record: each deferral goes in the board read's ledger record and in resolved, with decision
    deferred, the until date, and his steer. stats.py counts deferrals per project, because a
    deferral is data about priority.

# The reach test, applied to actions. A step goes to Wendell's checklist only if he is the only one
# who can do it: his accounts, his money, his name, his eyes on the result, or a permission he holds.
# Anything a session can do itself, it does.
step_test: >
  Only Wendell can take this step, because it needs his account, his money, his name, his judgement
  of the result, or a permission he holds. A step a session can take is never put on his list.

step_shape:   # every step on the checklist carries all of these
  do: one action, in plain words, starting with a verb
  where: the exact page, menu path or link where it happens
  enter: what to type or choose, never a secret; a secret is generated on the page and never stored
  check: how he knows it worked, as something he will see
  device: phone or computer
  stop_safe: whether he can stop after this step and pick up later without harm

stages:
  - id: intake
    owners: [shaman, diplomat]
    produces: spec.md Purpose and user stories, with the ask quoted in Wendell's words
    gate: >
      The ask is quoted, and who it is for is named. Every clarifying question goes through the reach
      test first; the spec kit interview's questions are answered from the record where it can.

  - id: spec
    owners: [architect, regent]
    produces: spec.md design decisions, contracts, acceptance
    gate: >
      Each design decision says whose it is: Wendell's (cited), a source's (named) or the council's
      (marked). Anything on the reserved list becomes a board question, never a decision.

  - id: falsify
    owners: [challenger]
    produces: spec.md section "How we will know it failed"
    gate: >
      One cheap test, run before the build, that could show the design is wrong, and the result that
      would stop the work. Root-game's rule, made general: confirm with a cheap test before building.

  - id: plan
    owners: [architect, regent]
    produces: plan.md and tasks.md, every task tagged [claude] or [wendell]
    gate: >
      Every [wendell] task passes step_test and has the full step_shape. Those tasks are published to
      the steps tab as one list for the feature before any build starts that depends on them.

  - id: build
    owners: [architect]
    produces: a pull request on its own branch
    gate: The repo's own checks pass, and the preview builds where the repo has one.

  - id: verify
    owners: [regent, diplomat]
    produces: the definition of done, checked; a walk-through for a person where the feature has one
    gate: >
      The falsification test passed. Any check only Wendell can make (his account, his eyes) is a
      list on the steps tab, and the feature is not done until he ticks it.

  - id: ship
    owners: [regent]
    produces: a board position "merges on the next board read unless flipped"
    gate: >
      Precedent: flirtcraft pull request #5 merged this way, its position standing on 2026-10-02.
      A feature that touches a reserved item (money, a live paywall, prose, a person's name) ships
      only on a board question he answers.

  - id: close
    owners: [sage]
    produces: a ledger record, tasks.md ticked, lessons_pending for anything he ruled
    gate: Every face's contribution is named, and the dissent is listed.

# Sense and respond, and transcend and include (Wendell, 2026-10-03; council/faces.yaml principles).
strands:
  what: >
    A strand is one unit of work with its own branch, its own small spec, its own ledger record, and a declared fork
    space: the files it may touch. The name and idea come from bars-engine's BARS Strand System.
  emergent_need: >
    When work finds a need it was not about (a broken setting, a wrong figure, a missing tool), the need becomes its
    own strand, started in parallel. The finding is stated where it was found; the fix lives in the new strand.
  branch: strand/<name>, or feature/<name> for a feature that runs the full pipeline
  fork_space: >
    Declared when the strand starts, as the files it may touch. Before a strand starts, run
    python3 council/strands.py in the repo: any overlap with an open strand's files is sequenced, never run at once.
  the_record_lives_on_main: >
    Board data, ledger records and lessons are written on main, never on a strand's branch, because they are shared
    by every strand. A strand's branch carries only its own work.
  handoff: Each strand's pull request says what it touches, what it depends on, and what it found but left for another strand.

transcend_and_include:
  versions: A design's later version keeps the earlier version's section in its spec, with what it got wrong.
  retire_not_delete: Superseded positions, terms and files are retired with their reason and date, and kept readable.
  keep_the_original: A corrected figure is written beside the original and its window or setting, never over it.
  synthesis: The Sage names what the synthesis keeps from each face, and which face's work it set down and why.
