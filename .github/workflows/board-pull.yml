# Records the Nonprofit Board's saves on main with no AI involved (docs/failure-modes.md).
# bars-engine holds the saves in Postgres; this pulls them from its token-protected route, runs board/pull.py
# unchanged, gathers a pasted morning menu with council/morning.py, rebuilds the Nonprofit Board, acknowledges what
# main now records, and fails the run if any save has waited more than six hours.
# Secrets: BOARD_PULL_TOKEN (same value as bars-engine's env var), COUNCIL_MENU_TOKEN (Lens goals for morning.py).
# Variable (optional): BARS_ENGINE_URL.
name: board-pull
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      menu_date:
        description: "Recover a sealed Tap the Vein menu for this date (YYYY-MM-DD) from bars-engine and record it"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: board-pull
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOARD_PULL_TOKEN: ${{ secrets.BOARD_PULL_TOKEN }}
      COUNCIL_MENU_TOKEN: ${{ secrets.COUNCIL_MENU_TOKEN }}
      BARS_ENGINE_URL: ${{ vars.BARS_ENGINE_URL || 'https://bars-engine.vercel.app' }}
      BOARD: nonprofit
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: johnair01/bars-engine
          path: bars-engine-src
      - run: |
          mv bars-engine-src ../bars-engine   # morning.py reads its backlog from ../bars-engine
          python3 -m pip install --quiet pyyaml jsonschema pytest
          git config user.name "board-pull[bot]"
          git config user.email "board-pull[bot]@users.noreply.github.com"
          # the board merge drivers (docs/merging.md) join rows by id when two pushes race
          git config merge.boardjson.driver "python3 council/tools/board_merge.py %O %A %B"
          git config merge.ours.driver true
      - name: Contract tests
        run: python3 -m pytest -q tests/test_save_contract.py tests/test_agents_md.py tests/test_save_accounting.py
      - name: Fetch the store from bars-engine
        run: python3 board/fetch_store.py fetch store
      - name: Record with pull.py
        id: pull
        run: |
          set -o pipefail
          python3 board/pull.py store --push --no-room | tee pull.log
      - name: Gather a pasted morning menu
        id: morning
        run: |
          if grep -q "^  morning/menu:" pull.log; then
            if [ -z "$COUNCIL_MENU_TOKEN" ]; then echo "skip=morning/menu" >> "$GITHUB_OUTPUT";
              echo "::warning::COUNCIL_MENU_TOKEN is not set; the pasted menu stays unrecorded"; exit 0; fi
            git pull -q --no-rebase origin main
            python3 council/morning.py --menu store/morning/menu.json --write
            git add board && git commit -q -m "Morning: gather the menu pasted on the Nonprofit Board" || true
          fi
      - name: Recover a sealed menu by date (manual runs only)
        if: ${{ inputs.menu_date != '' }}
        run: |
          # 2026-10-15: the menu pasted at 19:52 never reached main (docs/incidents.md). bars-engine holds the same
          # sealed menu, so a run with menu_date=2026-10-15 records it with no import and no database access.
          test -n "$COUNCIL_MENU_TOKEN" || { echo "::error::COUNCIL_MENU_TOKEN is not set"; exit 1; }
          git pull -q --no-rebase origin main
          python3 council/morning.py --fetch "${{ inputs.menu_date }}" --out store/fetched-menu.json --write
          git add board && git commit -q -m "Morning: recover the menu sealed on ${{ inputs.menu_date }}" || true
      - name: Rebuild the Nonprofit Board and push
        run: |
          git pull -q --no-rebase origin main
          python3 board/nonprofit/build.py
          git add board/nonprofit && git commit -q -m "Nonprofit Board: rebuild after pull" || true
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --no-rebase origin main; done
          git fetch -q origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Acknowledge what main records
        run: |
          # Every pending save gets a status (recorded, superseded, nothing-to-record, held, unaccounted). An
          # unaccounted save stays unacknowledged and fails this step (board/fetch_store.py).
          set -o pipefail
          python3 board/fetch_store.py ack store --record "six-faces-council@$(git rev-parse --short HEAD)" \
            ${{ steps.morning.outputs.skip && format('--except {0}', steps.morning.outputs.skip) || '' }} | tee ack.log
      - name: Staleness check (6 hours)
        if: always()
        run: |
          set -o pipefail
          python3 board/staleness.py --hours 6 | tee stale.log
      - name: Summary
        if: always()
        run: |
          { echo "### Board pull"; echo '```'; cat pull.log 2>/dev/null; echo '```';
            echo "### Saves accounted"; echo '```'; cat ack.log 2>/dev/null; echo '```';
            echo "### Staleness"; echo '```'; cat stale.log 2>/dev/null; echo '```';
            echo "### Needs work"; echo '```'; python3 board/needs_work.py; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
